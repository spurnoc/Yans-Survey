/* ═══════════════════════════════════════════════════════════════════════
   01 · LOCALE AND THEME

   Two switches, both in the header, both remembered only for the session.

   Translation is keyed on the English string rather than on an invented id.
   That keeps the source readable — you can still see the sentence you are
   looking at in the file — and a missing translation degrades to English
   rather than to "dashboard.service.lede.headline".

   The locale is read through a module-level variable that App sets at the top
   of its render. Every component below App renders afterwards, so they all see
   the same value, and changing it re-renders the whole tree from one setState.

   Content written by other people — customer reviews, organization names,
   uploaded file names — is deliberately not translated. Neither are the
   outbound drafts: a reply to an English review is written in English no
   matter which language the owner reads the dashboard in.
   ═══════════════════════════════════════════════════════════════════════ */

/* var, not let: the data files are evaluated before this one and call money(),
   so the binding has to be hoisted rather than sitting in a dead zone. */
var LOCALE = 'en';

function t(s) {
  if (LOCALE !== 'fr' || typeof s !== 'string') return s;
  const hit = typeof FR === 'undefined' ? undefined : FR[s];
  return hit === undefined ? s : hit;
}

/* Numbers and money follow the locale too: French Canadian puts the sign after
   the amount and uses a comma for the decimal. */
function money(n, cents = true) {
  const opts = { minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0 };
  if (LOCALE === 'fr') {
    return n.toLocaleString('fr-CA', opts).replace(/\u202f|\u00a0/g, ' ') + ' $';
  }
  return '$' + n.toLocaleString('en-CA', opts);
}

function num(n) {
  return n.toLocaleString(LOCALE === 'fr' ? 'fr-CA' : 'en-CA').replace(/\u202f|\u00a0/g, ' ');
}

/* ── The two header controls ───────────────────────────────────────────── */

function LocaleToggle({ locale, setLocale }) {
  return (
    React.createElement('div', { role: "group", 'aria-label': t('Language'), className: "inline-flex overflow-hidden rounded-lg border border-slate-200"    ,}
      , [['en', 'EN'], ['fr', 'FR']].map(([code, short]) => (
        React.createElement('button', {
          key: code,
          type: "button",
          onClick: () => setLocale(code),
          'aria-pressed': locale === code,
          lang: code === 'fr' ? 'fr-CA' : 'en-CA',
          className: 
            'mono inline-flex min-h-[44px] items-center px-3.5 text-sm font-medium uppercase tracking-[0.1em] transition ' +
            (locale === code ? 'bg-slate-900 text-white' : 'text-slate-500 hover:text-slate-900')
          ,}

          , short
          , React.createElement('span', { className: "sr-only",}, code === 'fr' ? ' français canadien' : ' Canadian English')
        )
      ))
    )
  );
}

function ThemeToggle({ dark, setDark }) {
  return (
    React.createElement('button', {
      type: "button",
      onClick: () => setDark(!dark),
      'aria-pressed': dark,
      className: "inline-flex min-h-[44px] items-center gap-2 rounded-lg border border-slate-200 px-3.5 py-2.5 text-base font-medium text-slate-600 transition hover:border-slate-300 hover:text-slate-900"              ,}

      , React.createElement('span', { 'aria-hidden': "true",}, dark ? '☾' : '☀')
      , React.createElement('span', { className: "hidden sm:inline" ,}, dark ? t('Dark') : t('Light'))
      , React.createElement('span', { className: "sr-only",}, t('Switch between light and dark'))
    )
  );
}

  'Every outbound button in the dashboard opens a draft first. Once one is sent it is recorded here with the time it went and the wording that left, so there is a record if somebody asks later.': 'Chaque bouton d’envoi du tableau de bord ouvre d’abord un brouillon. Une fois envoyé, tout est consigné ici avec l’heure et le texte exact, pour qu’il y ait une trace si quelqu’un pose la question plus tard.',
  'The rise across weeks five to eight is the summer push, then the tail back down. Food and labour barely notice it, which is what a well-sized campaign looks like.': 'La hausse des semaines cinq à huit, c’est la campagne d’été, puis la redescente. Les aliments et la main-d’œuvre le remarquent à peine : c’est à ça que ressemble une campagne bien calibrée.',
  '$158 a week in April, $247 now — a 56% rise while food cost stayed flat. The apps are taking a larger share of a business that is only growing slightly.': '158 $ par semaine en avril, 247 $ aujourd’hui — une hausse de 56 % alors que le coût des aliments est resté stable. Les applications prennent une part croissante d’un commerce qui ne grandit que légèrement.',

  'A search-heavy split means people are typing what they want to eat, not looking for you by name. Menu words matter more than the shop name here.': 'Une part dominée par la recherche veut dire que les gens tapent ce qu’ils veulent manger, sans vous chercher par votre nom. Les mots du menu comptent alors plus que le nom du commerce.',
  'Both are bagging problems rather than kitchen problems. A sealed soup lid and a checklist taped to the pickup shelf would answer most of this page.': 'Les deux sont des problèmes d’emballage, pas de cuisine. Un couvercle scellé sur les soupes et une liste collée sur la tablette de ramassage régleraient presque toute cette page.',
  'Each ring is a post going out. Tap one to read what it was. Every spike sits on the day of a publish and decays over about three days, which is the argument for posting on Thursday rather than Sunday.': 'Chaque anneau est une publication. Touchez-en un pour savoir laquelle. Chaque pointe tombe le jour d’une publication et s’estompe sur environ trois jours : voilà l’argument pour publier le jeudi plutôt que le dimanche.',
  'Facebook takes the same nine posts Instagram gets and returns a third of the reach. That is not an argument for abandoning it — it is where catering enquiries come from — but it is an argument for cross-posting rather than writing for it separately.': 'Facebook reçoit les mêmes neuf publications qu’Instagram et rend le tiers de la portée. Ce n’est pas une raison de l’abandonner — c’est de là que viennent les demandes de traiteur — mais c’en est une pour republier plutôt que d’écrire séparément.',
  'Five posts went out. Each one is a visible step up, and the cross-section on day 25 is the tallest thing on the chart.': 'Cinq publications sont sorties. Chacune fait un bond visible, et la coupe transversale du 25e jour est le sommet du graphique.',
  'It is a point above target, and the dish machine being down is part of the reason — somebody is being paid to do by hand what a machine did last month. The repair pays for itself in about three weeks.': 'Elle est un point au-dessus de la cible, et le lave-vaisselle en panne y est pour quelque chose — on paie quelqu’un pour faire à la main ce qu’une machine faisait le mois dernier. La réparation se rembourse en environ trois semaines.',

  'higher than counter tickets, because people order for a household rather than for themselves — which is also why the app takes a bigger bite in absolute dollars.': ' $ à celles du comptoir, parce que les gens commandent pour une maisonnée plutôt que pour eux seuls — ce qui explique aussi pourquoi l’application prélève davantage en dollars absolus.',
  'Email earned $16.40 for every dollar spent — it is the cheapest channel you own and the most neglected. Send weekly, not monthly.': 'Le courriel a rapporté 16,40 $ par dollar dépensé — c’est le canal le moins cher que vous possédez et le plus négligé. Envoyez chaque semaine, pas chaque mois.',
  'Flyers on Elm St returned $1.60 per dollar. That is the only line that barely paid for itself. Move the $300 into email and Meta.': 'Les circulaires de la rue Elm ont rapporté 1,60 $ par dollar. C’est la seule ligne qui s’est à peine payée. Déplacez les 300 $ vers le courriel et Meta.',
  'The delivery app promo bought orders you would likely have received anyway. Pause it and watch four weeks of volume before renewing.': 'La promo de l’application de livraison a acheté des commandes que vous auriez probablement eues de toute façon. Mettez-la en pause et observez quatre semaines de volume avant de renouveler.',
  'Delivery volume rose 12% and every one of those orders leaves in a box. Raise the line to': 'Le volume de livraison a monté de 12 % et chacune de ces commandes part dans une boîte. Montez le poste à',
  'Two thirds of new customers this July came in through a phone that was already inside the neighbourhood.': 'Cet été, deux tiers des nouveaux clients sont venus par un téléphone qui se trouvait déjà dans le quartier.',

  /* ── Second pass: data, menu items, reviews, fragments ────────────── */
  'Every complaint theme in the last ninety days except parking and line speed comes from an order that left the building in a bag. The food is not the problem and the reviews say so. Six people are waiting on a reply, and two of them wrote about cold soup.': 'Tous les thèmes de plainte des quatre-vingt-dix derniers jours, sauf le stationnement et la file, viennent d’une commande partie dans un sac. La nourriture n’est pas le problème et les avis le disent. Six personnes attendent une réponse, et deux d’entre elles ont écrit au sujet d’une soupe froide.',
  'They typed a sandwich into a phone and you were the closest good answer. Seven in ten arrived through plain search rather than the map, which means the words on the menu are doing more work than the name on the awning. Two customer questions have been sitting unanswered for days.': 'Ils ont tapé un sandwich dans un téléphone et vous étiez la meilleure réponse à proximité. Sept sur dix sont arrivés par la recherche plutôt que par la carte, ce qui veut dire que les mots du menu travaillent plus fort que le nom sur l’auvent. Deux questions de clients sont sans réponse depuis des jours.',
  'Fourteen thousand six hundred dollars sits in that pipeline, most of it in September, and the two largest came from an email that took nine minutes to write. The list of three thousand four hundred addresses is the only channel here that no platform can switch off.': 'Quatorze mille six cents dollars dorment dans cet entonnoir, surtout en septembre, et les deux plus grosses demandes viennent d’un courriel écrit en neuf minutes. La liste de trois mille quatre cents adresses est le seul canal ici qu’aucune plateforme ne peut éteindre.',
  'Packaging is over plan because delivery volume is up twelve percent and every one of those orders leaves in a box. That is a good problem wearing a bad costume. Labour is the line to actually watch, sitting a point above target while the dish machine is down.': 'L’emballage dépasse le plan parce que le volume de livraison est en hausse de douze pour cent et que chacune de ces commandes part dans une boîte. C’est un bon problème déguisé en mauvais. La main-d’œuvre est le poste à surveiller vraiment, un point au-dessus de la cible pendant que le lave-vaisselle est en panne.',
  'The Daily 15 is the whole job compressed into a quarter of an hour: six stops, one for each part of the business, done once a day standing at the counter. Ten minutes remain, and the next of them belongs to Content — one photograph of the special, posted before the lunch line builds.': 'Les 15 minutes, c’est tout le travail comprimé en un quart d’heure : six arrêts, un par volet de l’entreprise, faits une fois par jour debout au comptoir. Il reste dix minutes, et la prochaine revient au Contenu — une photo du spécial, publiée avant que la file du midi se forme.',
  'The report covers five channels and one month. Two of them barely paid for themselves, and the cheapest one you own outperformed everything else by a factor of four. The whole document is here, but the decision it points to fits in a sentence: send more email.': 'Le rapport couvre cinq canaux et un mois. Deux d’entre eux se sont à peine payés, et le moins cher que vous possédez a surpassé tous les autres par un facteur de quatre. Le document complet est ici, mais la décision qu’il indique tient en une phrase : envoyez plus de courriels.',

/* ═══════════════════════════════════════════════════════════════════════
   10 · PRIMITIVES
   Two rules hold across every component here:
     · nothing renders below text-sm (15px), and text-sm is always semibold
     · anything clickable is at least 48px tall
   ═══════════════════════════════════════════════════════════════════════ */

/* Eyebrow label. Mono, spaced, quiet — the original file's .label, kept. */
function Kicker({ children, tone = 'amber', className = '' }) {
  const colour = tone === 'amber' ? 'text-amber-700' : 'text-slate-500';
  return (
    React.createElement('p', { className: 'mono text-sm font-medium uppercase tracking-[0.14em] ' + colour + ' ' + className,}
      , t(children)
    )
  );
}

/* Section divider — a hairline. The broadsheet rhythm comes from the column
   structure and the standfirst, not from heavy black rules. */
function Rule({ className = '' }) {
  return React.createElement('div', { className: 'border-t border-slate-200/80 ' + className,} );
}

/* A ledger row: label, dotted leader, figure. The house pattern for any
   number that belongs to a statement rather than a chart. */
function LedgerRow({ label, value, tone = 'ink', strong = false, indent = false }) {
  const tones = {
    ink: 'text-slate-900',
    minus: 'text-rose-700',
    plus: 'text-emerald-700',
    soft: 'text-slate-600',
  };
  return (
    React.createElement('div', { className: 'flex items-baseline gap-3 py-2.5 ' + (indent ? 'pl-5' : ''),}
      , React.createElement('span', { className: 'text-base leading-relaxed ' + (strong ? 'font-semibold text-slate-900' : 'text-slate-600'),}
        , t(label)
      )
      , React.createElement('span', { className: "leader", 'aria-hidden': "true",} )
      , React.createElement('span', { className: 'tabular whitespace-nowrap text-lg font-semibold ' + tones[tone],}
        , value
      )
    )
  );
}

/* Big scannable metric. */
function Stat({ label, value, sub, tone = 'ink' }) {
  const tones = { ink: 'text-slate-900', plus: 'text-emerald-700', minus: 'text-rose-700' };
  return (
    React.createElement('div', null
      , React.createElement('p', { className: "mono text-sm font-medium uppercase tracking-[0.12em] text-slate-500"     ,}, t(label))
      , React.createElement('p', { className: 'tabular mt-2 text-3xl leading-none ' + tones[tone],}, value)
      , sub ? React.createElement('p', { className: "mt-2 text-base leading-relaxed text-slate-500"   ,}, t(sub)) : null
    )
  );
}

/* Status pill. Never the only signal — always paired with words. */
function Pill({ children, tone = 'neutral' }) {
  const tones = {
    good: 'bg-emerald-50 text-emerald-800 border-emerald-200',
    bad: 'bg-rose-50 text-rose-800 border-rose-200',
    watch: 'bg-amber-50 text-amber-800 border-amber-200',
    neutral: 'bg-slate-100 text-slate-700 border-slate-300',
  };
  return (
    React.createElement('span', { className: 'inline-flex items-center rounded-full border px-3 py-1 text-sm font-semibold ' + tones[tone],}
      , t(children)
    )
  );
}

/* The one mark that means "this card sends something out". Kept identical
   everywhere so it reads as a category, not a decoration. */
function SendsFlag() {
  return (
    React.createElement('span', { className: "mono inline-flex shrink-0 items-center gap-1.5 rounded-full border border-slate-200 px-3 py-1 text-sm font-medium uppercase tracking-[0.1em] text-slate-500"              ,}
      , React.createElement('span', { 'aria-hidden': "true",}, "↗"), " " , t('Sends')
    )
  );
}

/* ── Bento block ────────────────────────────────────────────────────────
   The card is the trigger. The card body stays quiet: a headline, a few
   figures, at most three rows. Everything else lives behind the button.
   The <div>{t("click is a mouse convenience; the")}<button> is the real control,
   so keyboard and screen-reader users get one unambiguous target.        */
/* `action` marks a card that sends something out of the building. It draws a
   flag in the header — one consistent mark across the whole dashboard, so any
   card carrying it can be spotted without reading — and an invitation line
   above the button naming where the thing actually goes. */
function Block({ kicker, title, lede, children, cta, onOpen, action, className = '', tone = 'plain' }) {
  const id = t('blk-') + title.toLowerCase().replace(/[^a-z0-9]+/g, '-');
  const shell =

/* The header gets out of the way when you are reading down the page and comes
   back the moment you scroll up, so the six domains are never more than a
   flick away. Below the fold threshold it always shows — no flicker at the top
   of a short domain. Keyboard focus reveals it too, or tabbing to a hidden
   control would scroll to nothing. */
function useHideOnScroll(threshold = 90) {
  const [hidden, setHidden] = useState(false);
  const last = useRef(0);
  useEffect(() => {
    const onScroll = () => {
      const y = window.scrollY;
      if (y < threshold) { setHidden(false); last.current = y; return; }
      const delta = y - last.current;
      if (Math.abs(delta) < 8) return;
      setHidden(delta > 0);
      last.current = y;
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, [threshold]);
  return [hidden, setHidden];
}

    root.classList.toggle('dark', dark);

  const [overlayKey, setOverlayKey] = useState(null);
  const [steps, setSteps] = useState(DAILY_15);
  const [posted, setPosted] = useState({});
  const [replied, setReplied] = useState({});
  const [answered, setAnswered] = useState({});
  const [disputed, setDisputed] = useState({});
  const [nudged, setNudged] = useState({});
  const [sent, setSent] = useState([]);
  /* { spec, mark } — mark says which "done" flag to set once it sends */
  const [composer, setComposer] = useState(null);
  const [running, setRunning] = useState(false);
  const [started, setStarted] = useState(false);

  /* Minutes remaining are derived from the stops, not tracked separately —
     ticking a stop is what moves the clock, so the two cannot disagree. */
  const minutesLeft = steps.filter((s) => !s.done).reduce((n, s) => n + s.minutes, 0);
  const [secondsLeft, setSecondsLeft] = useState(minutesLeft * 60);

  useEffect(() => {
    if (!running) return;
    const timer = setInterval(() => setSecondsLeft((n) => (n > 0 ? n - 1 : 0)), 1000);
    return () => clearInterval(timer);
  }, [running]);

  const clock = Math.floor(secondsLeft / 60) + ':' + String(secondsLeft % 60).padStart(2, '0');

  const toggleRun = useCallback(() => {
    setStarted(true);
    setRunning((r) => !r);
  }, []);

  const toggleStep = useCallback((id) => {
    setSteps((prev) => {
      const next = prev.map((s) => (s.id === id ? Object.assign({}, s, { done: !s.done }) : s));
      setSecondsLeft(next.filter((s) => !s.done).reduce((n, s) => n + s.minutes, 0) * 60);
      return next;
    });
  }, []);

  /* Nothing leaves without passing through the composer, so there is exactly
     one place where an outbound message is written, checked and recorded. */
  const draft = useCallback((spec, mark) => setComposer({ spec: spec, mark: mark || {} }), []);

  const handleSend = useCallback((message) => {
    setSent((s) => s.concat([message]));
    const mark = composer ? composer.mark : {};
    if (mark.posted) setPosted((p) => Object.assign({}, p, { [mark.posted]: true }));
    if (mark.replied) setReplied((p) => Object.assign({}, p, { [mark.replied]: true }));
    if (mark.answered) setAnswered((p) => Object.assign({}, p, { [mark.answered]: true }));
    if (mark.disputed) setDisputed((p) => Object.assign({}, p, { [mark.disputed]: true }));
    if (mark.nudged) setNudged((p) => Object.assign({}, p, { [mark.nudged]: true }));
  }, [composer]);

     edited before it goes rather than after it is public. */
  const approve = useCallback((id) => {

    draft(postDrafts(post), { posted: id });
  }, [draft]);

  const open = useCallback((key) => setOverlayKey(key), []);

  const goTo = useCallback((tab, overlayKeyToOpen) => {

        , t("Skip to the dashboard"), "  "  )

      , React.createElement('header', {

      )

      , React.createElement('main', { id: "canvas", className: "mx-auto max-w-7xl px-5 pb-20 pt-10 lg:px-10"     ,}
        , TABS.map((tab) => (
          React.createElement('div', { key: tab.id, role: "tabpanel", id: 'panel-' + tab.id, 'aria-labelledby': t('tab-') + tab.id, hidden: tab.id !== activeTab,}
            , tab.id === activeTab ? (

                , React.createElement('div', { className: "min-w-0",}, domains[tab.id])
                , rails[tab.id]
