<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily 15">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Daily 15 — Business Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --cream-bg:#efece8;
  --cream-surface:#e8e6e3;
  --cream-light:#f5f3f0;
  --warm-dark:#1a1a1a;
  --warm-muted:rgba(26,26,26,0.5);
  --warm-faint:rgba(26,26,26,0.06);
  --warm-border:rgba(26,26,26,0.07);
  --accent:#d6364e;
  --accent-soft:rgba(214,54,78,0.08);
  --accent-hover:#ff3344;
  --radius:14px;
  --radius-lg:20px;
  --radius-pill:9999px;
}

html,body{height:100%;overflow:hidden}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  color:var(--warm-dark);
  background:var(--cream-bg);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;outline:none}
textarea{resize:none}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.1);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,0.18)}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes pulse{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

#app{
  display:flex;flex-direction:column;height:100vh;
  max-width:600px;margin:0 auto;position:relative;
  background:var(--cream-bg);
}

/* ── Header ─────────────────────────────────────────── */
.header{
  padding:18px 24px 14px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;z-index:10;
}
.header-brand{display:flex;align-items:center;gap:10px}
.brand-mark{
  width:32px;height:32px;border-radius:8px;
  background:var(--warm-dark);color:var(--cream-bg);
  display:flex;align-items:center;justify-content:center;
  font-family:'Instrument Serif',serif;font-size:16px;font-style:italic;
}
.header-title{
  font-family:'Instrument Serif',serif;font-size:19px;
  letter-spacing:-0.3px;line-height:1.2;
}
.header-sub{
  font-size:11px;color:var(--warm-muted);
  margin-top:1px;letter-spacing:0.2px;
  font-variant-numeric:tabular-nums;
}
.reset-btn{
  font-size:12px;color:var(--warm-muted);
  padding:6px 14px;border-radius:var(--radius-pill);
  transition:all .2s;font-weight:500;
}
.reset-btn:hover{background:var(--warm-faint);color:var(--warm-dark)}

/* Mode pill */
.mode-pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 10px;border-radius:var(--radius-pill);
  font-size:10px;font-weight:600;
  font-family:'JetBrains Mono',monospace;text-transform:uppercase;
  letter-spacing:0.06em;white-space:nowrap;
  transition:all .3s;
}
.mode-pill::before{
  content:'';width:5px;height:5px;border-radius:50%;
  display:inline-block;
}
.mode-pill.onboarding{background:var(--accent-soft);color:var(--accent)}
.mode-pill.onboarding::before{background:var(--accent);animation:pulse 2s infinite}
.mode-pill.checkin{background:rgba(22,163,74,0.08);color:#16a34a}
.mode-pill.checkin::before{background:#16a34a}

/* Mode transition animation */
.mode-transition{
  animation:modeSwitch .5s cubic-bezier(0.22,1,0.36,1);
}
@keyframes modeSwitch{
  0%{opacity:0;transform:translateY(-8px)}
  100%{opacity:1;transform:translateY(0)}
}

/* ── Progress ───────────────────────────────────────── */
.progress-bar{
  display:flex;gap:4px;padding:0 24px 14px;flex-shrink:0;
}
.progress-dot{
  flex:1;height:3px;border-radius:2px;
  background:var(--warm-faint);
  transition:background .4s,opacity .4s;
}
.progress-dot.done{background:var(--accent)}
.progress-dot.current{
  background:var(--accent);opacity:0.4;
  animation:blink 2s infinite;
}

/* ── Chat ───────────────────────────────────────────── */
.chat-area{
  flex:1;overflow-y:auto;
  padding:8px 24px 20px;
  display:flex;flex-direction:column;gap:18px;
  scroll-behavior:smooth;
}

/* AI message */
.msg-ai{
  align-self:flex-start;max-width:82%;
  animation:msgIn .35s cubic-bezier(0.22,1,0.36,1);
}
.msg-ai-bubble{
  padding:13px 18px;
  background:var(--cream-light);
  border:1px solid var(--warm-border);
  border-radius:var(--radius-lg) var(--radius-lg) var(--radius-lg) 4px;
  font-size:14.5px;line-height:1.6;
  word-wrap:break-word;
}
.msg-ai-bubble strong{font-weight:600;color:var(--warm-dark)}

/* User message */
.msg-user{
  align-self:flex-end;max-width:82%;
  padding:13px 18px;
  background:var(--warm-dark);color:var(--cream-bg);
  border-radius:var(--radius-lg) var(--radius-lg) 4px var(--radius-lg);
  font-size:14.5px;line-height:1.6;
  word-wrap:break-word;
  animation:msgIn .35s cubic-bezier(0.22,1,0.36,1);
}

/* Typing indicator */
.typing-wrap{align-self:flex-start;animation:fadeIn .2s}
.typing{
  display:flex;align-items:center;gap:5px;
  padding:2px 0;
}
.typing span{
  width:7px;height:7px;border-radius:50%;
  background:var(--warm-muted);
  animation:pulse 1.4s infinite;
}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}

/* Streaming cursor */
.stream-cursor{
  display:inline-block;width:2px;height:1.1em;
  background:var(--accent);margin-left:2px;
  animation:blink .9s infinite;vertical-align:text-bottom;
  border-radius:1px;
}

/* ── Input area ────────────────────────────────────── */
.input-area{
  padding:12px 24px 20px;
  flex-shrink:0;
  border-top:1px solid var(--warm-border);
}

/* Choice buttons */
.choices{display:flex;flex-direction:column;gap:7px}
.choice-btn{
  padding:13px 16px;
  background:var(--cream-light);
  border:1px solid var(--warm-border);
  border-radius:var(--radius);
  font-size:14px;color:var(--warm-dark);
  text-align:left;
  display:flex;align-items:center;gap:12px;
  transition:all .18s cubic-bezier(0.22,1,0.36,1);
  animation:msgIn .3s;
}
.choice-btn:hover{
  border-color:var(--accent);
  background:var(--accent-soft);
  transform:translateX(2px);
}
.choice-btn:active{transform:scale(0.985)}
.choice-btn .dot{
  width:14px;height:14px;border-radius:50%;
  border:2px solid var(--warm-border);
  flex-shrink:0;transition:all .18s;
}
.choice-btn:hover .dot{border-color:var(--accent)}

/* Text input */
.text-wrap{display:flex;gap:8px;align-items:flex-end}
.text-input{
  flex:1;padding:13px 16px;
  background:var(--cream-light);
  border:1px solid var(--warm-border);
  border-radius:var(--radius);
  font-size:14.5px;line-height:1.5;
  color:var(--warm-dark);
  min-height:46px;max-height:120px;
  transition:border-color .2s;
}
.text-input:focus{border-color:var(--accent)}
.text-input::placeholder{color:rgba(26,26,26,0.35)}
.send-btn{
  width:46px;height:46px;
  border-radius:var(--radius);
  background:var(--warm-dark);color:var(--cream-bg);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:18px;
  transition:all .2s;
}
.send-btn:hover{background:var(--accent)}
.send-btn:disabled{opacity:0.35;cursor:not-allowed}

/* ── Complete screen ────────────────────────────────── */
.complete-screen{
  text-align:center;padding:32px 20px;
  animation:msgIn .5s cubic-bezier(0.22,1,0.36,1);
}
.complete-icon{
  width:56px;height:56px;margin:0 auto 16px;
  border-radius:50%;
  background:var(--accent-soft);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;
}
.complete-screen h2{
  font-family:'Instrument Serif',serif;font-size:26px;
  margin-bottom:8px;letter-spacing:-0.3px;
}
.complete-screen p{
  font-size:14px;color:var(--warm-muted);
  max-width:360px;margin:0 auto 24px;line-height:1.6;
}
.transcript-toggle{
  font-size:13px;color:var(--accent);cursor:pointer;
  text-align:center;padding:8px;font-weight:500;
  transition:opacity .15s;
}
.transcript-toggle:hover{opacity:0.7}
.transcript-panel{
  max-width:90%;align-self:center;
  background:var(--cream-light);
  border:1px solid var(--warm-border);
  border-radius:var(--radius);padding:16px 20px;
  margin:8px 0;font-size:13px;line-height:1.6;
  display:none;
}
.transcript-panel.open{display:block;animation:fadeIn .3s}
.transcript-panel h4{
  font-family:'Instrument Serif',serif;font-size:15px;margin-bottom:10px;
}
.t-row{padding:8px 0;border-bottom:1px solid var(--warm-border)}
.t-row:last-child{border-bottom:none}
.t-q{font-weight:500;color:var(--warm-dark);font-size:13px}
.t-a{color:var(--warm-muted);margin-top:3px}

@media(max-width:480px){
  #app{max-width:100%}
  .msg-ai,.msg-user{max-width:90%}
  .header{padding:14px 16px 12px;flex-wrap:wrap;gap:6px}
  .progress-bar{padding:0 16px 12px}
  .chat-area{padding:8px 16px 16px}
  .input-area{padding:10px 16px 16px}
  .header-title{font-size:17px}
  .mode-pill{font-size:9px;padding:2px 8px}
  .header-brand{gap:8px}
  .brand-mark{width:28px;height:28px;font-size:14px}
}
@media(max-width:375px){
  .header-title{font-size:15px}
  .header-sub{font-size:10px}
  .reset-btn{font-size:11px;padding:5px 10px}
  .mode-pill{font-size:8px;padding:2px 6px}
  .msg-ai-bubble,.msg-user{font-size:13px;padding:11px 14px}
  .choice-btn{font-size:13px;padding:11px 14px}
  .text-input{font-size:13.5px;padding:11px 14px}
  .send-btn{width:42px;height:42px;font-size:16px}
}

/* ── Auth screen ─────────────────────────────────────────── */
.auth-overlay{
  position:fixed;inset:0;z-index:1000;
  display:flex;align-items:center;justify-content:center;
  background:var(--cream-bg);
  animation:fadeIn .3s;
}
.auth-card{
  width:100%;max-width:380px;
  padding:40px 32px;
  background:var(--cream-light);
  border:1px solid var(--warm-border);
  border-radius:var(--radius-lg);
  box-shadow:0 2px 20px rgba(0,0,0,0.04);
}
.auth-brand{
  display:flex;align-items:center;gap:10px;
  margin-bottom:28px;justify-content:center;
}
.auth-brand .brand-mark{width:36px;height:36px;font-size:18px}
.auth-title{
  font-family:'Instrument Serif',serif;font-size:22px;
  text-align:center;margin-bottom:6px;letter-spacing:-0.3px;
}
.auth-sub{
  font-size:13px;color:var(--warm-muted);
  text-align:center;margin-bottom:24px;
}
.auth-tabs{
  display:flex;gap:0;margin-bottom:20px;
  border:1px solid var(--warm-border);border-radius:var(--radius);
  overflow:hidden;
}
.auth-tab{
  flex:1;padding:10px;text-align:center;
  font-size:13px;font-weight:500;color:var(--warm-muted);
  transition:all .2s;
}
.auth-tab.active{
  background:var(--warm-dark);color:var(--cream-bg);
}
.auth-field{margin-bottom:14px}
.auth-field label{
  display:block;font-size:12px;font-weight:500;
  color:var(--warm-muted);margin-bottom:5px;
  text-transform:uppercase;letter-spacing:0.05em;
}
.auth-field input{
  width:100%;padding:12px 14px;
  background:var(--cream-bg);
  border:1px solid var(--warm-border);
  border-radius:var(--radius);
  font-size:14px;color:var(--warm-dark);
  transition:border-color .2s;
}
.auth-field input:focus{border-color:var(--accent)}
.auth-field input::placeholder{color:rgba(26,26,26,0.3)}
.auth-error{
  font-size:13px;color:var(--accent);
  margin-bottom:12px;display:none;
}
.auth-error.show{display:block;animation:shake .4s}
.auth-submit{
  width:100%;padding:13px;
  background:var(--warm-dark);color:var(--cream-bg);
  border-radius:var(--radius);font-size:14px;font-weight:600;
  transition:all .2s;margin-top:6px;
}
.auth-submit:hover{background:var(--accent)}
.auth-submit:disabled{opacity:0.5;cursor:not-allowed}
.auth-logout{
  font-size:11px;color:var(--warm-muted);cursor:pointer;
  padding:4px 10px;border-radius:var(--radius-pill);
  transition:all .2s;font-weight:500;
}
.auth-logout:hover{background:var(--warm-faint);color:var(--warm-dark)}

/* ── Reminder settings ─────────────────────────────────── */
.reminder-section{
  margin-top:24px;padding:20px;
  background:var(--cream-light);
  border:1px solid var(--warm-border);
  border-radius:var(--radius);
}
.reminder-section h3{
  font-size:14px;font-weight:600;margin-bottom:4px;
}
.reminder-section p.reminder-desc{
  font-size:12px;color:var(--warm-muted);margin-bottom:14px;
}
.reminder-fields{
  display:flex;flex-direction:column;gap:10px;
}
.reminder-field-row{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
}
.reminder-field-row input[type="email"],
.reminder-field-row input[type="text"]{
  flex:1;min-width:0;padding:10px 12px;
  background:var(--cream-bg);border:1px solid var(--warm-border);
  border-radius:var(--radius);font-size:13px;color:var(--warm-dark);
  transition:border-color .2s;
}
.reminder-field-row input:focus{border-color:var(--accent)}
.reminder-field-row input::placeholder{color:rgba(26,26,26,0.3)}
.reminder-time-input{
  width:90px;flex:0 0 auto;padding:10px 12px;
  background:var(--cream-bg);border:1px solid var(--warm-border);
  border-radius:var(--radius);font-size:13px;color:var(--warm-dark);
}
.reminder-toggle-row{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:10px;
}
.reminder-toggle-label{
  font-size:13px;font-weight:500;
}
.toggle-switch{
  position:relative;width:42px;height:24px;
  background:var(--warm-border);border-radius:12px;
  cursor:pointer;transition:background .2s;flex-shrink:0;
}
.toggle-switch.on{background:var(--accent)}
.toggle-switch::after{
  content:'';position:absolute;top:3px;left:3px;
  width:18px;height:18px;border-radius:50%;
  background:var(--cream-light);transition:transform .2s;
}
.toggle-switch.on::after{transform:translateX(18px)}
.reminder-save-btn{
  margin-top:12px;padding:10px 20px;
  background:var(--warm-dark);color:var(--cream-bg);
  border-radius:var(--radius);font-size:13px;font-weight:600;
  transition:all .2s;
}
.reminder-save-btn:hover{background:var(--accent)}
.reminder-save-btn:disabled{opacity:0.5;cursor:not-allowed}
.reminder-status{
  font-size:12px;margin-top:8px;display:none;
}
.reminder-status.show{display:block;animation:fadeIn .3s}
.reminder-status.success{color:#2d8a4e}
.reminder-status.error{color:var(--accent)}
.settings-modal{
  position:fixed;inset:0;z-index:900;
  display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.3);animation:fadeIn .2s;
}
.settings-modal.show{display:flex}
.settings-card{
  width:100%;max-width:420px;
  padding:32px 28px;background:var(--cream-light);
  border:1px solid var(--warm-border);border-radius:var(--radius-lg);
  box-shadow:0 4px 30px rgba(0,0,0,0.08);
}
.settings-close{
  float:right;font-size:20px;color:var(--warm-muted);
  cursor:pointer;line-height:1;transition:color .2s;
}
.settings-close:hover{color:var(--warm-dark)}

/* ── Voice input / mic button ──────────────────────────── */
.mic-btn{
  width:46px;height:46px;
  border-radius:var(--radius);
  background:var(--cream-light);
  border:1px solid var(--warm-border);
  color:var(--warm-muted);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:18px;
  transition:all .2s;
}
.mic-btn:hover{
  border-color:var(--accent);
  color:var(--warm-dark);
}
.mic-btn.recording{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
  animation:micPulse 1.5s infinite;
}
@keyframes micPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(214,54,78,0.4)}
  50%{box-shadow:0 0 0 8px rgba(214,54,78,0)}
}
.recording-indicator{
  display:none;align-items:center;gap:6px;
  font-size:12px;color:var(--accent);font-weight:500;
  padding:4px 0 8px;
}
.recording-indicator.show{display:flex}
.recording-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  animation:recDotPulse 1s infinite;
}
@keyframes recDotPulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:0.3;transform:scale(0.7)}
}

/* ── Language selector ──────────────────────────────────── */
.lang-select-row{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;
  padding:10px 12px;
  background:var(--cream-bg);
  border:1px solid var(--warm-border);
  border-radius:var(--radius);
}
.lang-select-label{
  font-size:13px;font-weight:500;
}
.lang-select{
  padding:6px 12px;
  background:var(--cream-light);
  border:1px solid var(--warm-border);
  border-radius:var(--radius);
  font-size:13px;color:var(--warm-dark);
  font-family:inherit;
  cursor:pointer;
}

/* ── Branding logo ─────────────────────────────────────── */
.brand-logo{
  width:32px;height:32px;border-radius:8px;
  object-fit:cover;
}
</style>
</head>
<body>

<!-- Auth overlay — shown if no valid token -->
<div class="auth-overlay" id="auth-overlay" style="display:flex">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-mark">B</div>
    </div>
    <div class="auth-title" id="auth-title">Welcome back</div>
    <div class="auth-sub" id="auth-sub">Log in to continue your survey</div>
    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-login" onclick="switchAuthMode('login')">Log In</div>
      <div class="auth-tab" id="tab-register" onclick="switchAuthMode('register')">Register</div>
    </div>
    <div class="auth-error" id="auth-error"></div>
    <div class="auth-field">
      <label for="auth-email">Email</label>
      <input type="email" id="auth-email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="auth-field">
      <label for="auth-password">Password</label>
      <input type="password" id="auth-password" placeholder="At least 8 characters" autocomplete="current-password">
    </div>
    <button class="auth-submit" id="auth-submit" onclick="handleAuth()">Log In</button>
  </div>
</div>

<div id="app">
  <div class="header">
    <div class="header-brand">
      <div class="brand-mark">B</div>
      <div>
        <div class="header-title">Daily 15</div>
        <div class="header-sub" id="header-sub">Loading…</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="mode-pill onboarding" id="mode-pill">Onboarding</span>
      <div class="reset-btn" onclick="openSettingsModal()" role="button" aria-label="Reminder settings" tabindex="0">Settings</div>
      <div class="reset-btn" onclick="resetSurvey()" role="button" aria-label="Reset survey" tabindex="0">Reset</div>
      <div class="auth-logout" onclick="logout()" role="button" aria-label="Log out" tabindex="0">Logout</div>
    </div>
  </div>

  <div class="progress-bar" id="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemax="0" aria-label="Survey progress"></div>

  <div class="chat-area" id="chat-area" role="log" aria-live="polite" aria-label="Survey conversation">

// Translation lookup function
function t(key, params) {
  let text = translations[key] || FALLBACK_TRANSLATIONS[currentLang]?.[key] || FALLBACK_TRANSLATIONS.en[key] || key;
  if (params) {
    for (const [k, v] of Object.entries(params)) {
      text = text.replace(`{${k}}`, v);
    }
  }
  return text;
}

// Fetch translations from server; fall back to bundled set
async function loadTranslations(lang) {
  try {
    const resp = await fetch(`/api/i18n/${lang}`);
    if (resp.ok) {
      const data = await resp.json();
      // API returns {language, translations: {...}} — extract the translations dict
      translations = data.translations || data;
    } else {
      translations = FALLBACK_TRANSLATIONS[lang] || FALLBACK_TRANSLATIONS.en;
    }
  } catch (e) {
    translations = FALLBACK_TRANSLATIONS[lang] || FALLBACK_TRANSLATIONS.en;
  }
}

async function loadBranding(sid) {

    } else {

  } catch (e) {

  }
  applyBranding();
}

function applyBranding() {
  if (!branding) return;

  // Apply primary_color as CSS variable overrides
  if (branding.primary_color) {
    document.documentElement.style.setProperty('--accent', branding.primary_color);
    document.documentElement.style.setProperty('--warm-dark', branding.primary_color);
    // Derive a soft version for accent-soft
    const soft = hexToRgba(branding.primary_color, 0.08);
    if (soft) document.documentElement.style.setProperty('--accent-soft', soft);
  }

  // Replace business name in header

    if (titleEl) titleEl.textContent = branding.business_name;

    const appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
    if (appleTitle) appleTitle.setAttribute('content', branding.business_name);
  }

      img.src = branding.logo_url;
      img.className = 'brand-logo';
      img.alt = branding.business_name || 'Brand';
      brandMark.appendChild(img);
    }

// Helper: convert hex color to rgba string
function hexToRgba(hex, alpha) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  if (!m) return null;
  const r = parseInt(m[1], 16);
  const g = parseInt(m[2], 16);
  const b = parseInt(m[3], 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ── Voice input (Web Speech API) ──────────────────────────────
let speechRecognition = null;
let isRecording = false;

// Initialize speech recognition object
function initSpeechRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = currentLang === 'fr' ? 'fr-FR' : 'en-US';

  recognition.onresult = (event) => {
    let interimTranscript = '';
    let finalTranscript = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;
      if (event.results[i].isFinal) {
        finalTranscript += transcript;
      } else {
        interimTranscript += transcript;
      }
    }
    const ta = document.getElementById('text-answer');
    if (ta) {
      ta.value = finalTranscript || interimTranscript;
      autoGrow(ta);
    }
  };

  recognition.onend = () => {
    isRecording = false;
    updateMicButtonState();
  };

  recognition.onerror = (event) => {
    isRecording = false;
    updateMicButtonState();
    console.error('Speech recognition error:', event.error);
  };

  return recognition;
}

// Check if Web Speech API is available
function isSpeechRecognitionAvailable() {
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}

// Show or hide mic button based on API availability and mode
function showMicButton() {
  const micBtn = document.getElementById('mic-btn');
  if (!micBtn) return;
  if (isSpeechRecognitionAvailable() && currentMode === 'checkin') {
    micBtn.style.display = 'flex';
  } else {
    micBtn.style.display = 'none';
  }
}

// Toggle voice input on/off
function toggleVoiceInput() {
  if (isRecording) {
    stopVoiceInput();
    return;
  }
  startVoiceInput();
}

function startVoiceInput() {
  if (!isSpeechRecognitionAvailable()) return;
  if (!speechRecognition) {
    speechRecognition = initSpeechRecognition();
    if (!speechRecognition) return;
  }
  speechRecognition.lang = currentLang === 'fr' ? 'fr-FR' : 'en-US';
  try {
    speechRecognition.start();
    isRecording = true;
    updateMicButtonState();
  } catch (e) {
    // start() throws if already started
    isRecording = false;
    updateMicButtonState();
  }
}

function stopVoiceInput() {
  if (speechRecognition && isRecording) {
    try { speechRecognition.stop(); } catch(e) {}
  }
  isRecording = false;
  updateMicButtonState();
}

function updateMicButtonState() {
  const micBtn = document.getElementById('mic-btn');
  const indicator = document.getElementById('recording-indicator');
  if (!micBtn) return;
  if (isRecording) {
    micBtn.classList.add('recording');
    if (indicator) indicator.classList.add('show');
  } else {
    micBtn.classList.remove('recording');
    if (indicator) indicator.classList.remove('show');
  }
}

// ── Auth token management ──────────────────────────────────────
function getAuthToken() {
  return localStorage.getItem('auth_token');
}

function setAuthToken(token) {
  localStorage.setItem('auth_token', token);
}

function clearAuthToken() {
  localStorage.removeItem('auth_token');
}

function authHeaders(extra = {}) {
  const token = getAuthToken();
  const headers = { ...extra };
  if (token) {
    headers['Authorization'] = `Bearer ${token}`;
  }
  return headers;
}

// Helper: fetch with AbortController-based timeout (default 30s)
// Automatically adds Authorization header for authenticated requests.
async function fetchWithTimeout(url, options = {}, timeout = 30000) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), timeout);
  try {
    // Merge auth header into request headers
    const mergedOptions = {
      ...options,
      headers: authHeaders(options.headers || {}),
      signal: controller.signal,
    };
    const resp = await fetch(url, mergedOptions);
    // If we get a 401, the token is invalid — show auth screen
    if (resp.status === 401) {
      clearAuthToken();
      showAuthOverlay();
    }
    return resp;
  } finally {
    clearTimeout(timeoutId);
  }
}

// ── Auth UI ────────────────────────────────────────────────────
function showAuthOverlay() {
  document.getElementById('auth-overlay').style.display = 'flex';
  document.getElementById('auth-email').focus();
}

function hideAuthOverlay() {
  document.getElementById('auth-overlay').style.display = 'none';
}

function showAuthError(msg) {
  const el = document.getElementById('auth-error');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

function switchAuthMode(mode) {
  authMode = mode;
  const loginTab = document.getElementById('tab-login');
  const registerTab = document.getElementById('tab-register');
  const title = document.getElementById('auth-title');
  const sub = document.getElementById('auth-sub');
  const submitBtn = document.getElementById('auth-submit');
  const pwInput = document.getElementById('auth-password');

  if (mode === 'login') {
    loginTab.classList.add('active');
    registerTab.classList.remove('active');
    title.textContent = t('welcome_back');
    sub.textContent = t('log_in_to_continue');
    submitBtn.textContent = t('log_in');
    pwInput.setAttribute('autocomplete', 'current-password');
  } else {
    loginTab.classList.remove('active');
    registerTab.classList.add('active');
    title.textContent = t('create_account');
    sub.textContent = t('register_to_start');
    submitBtn.textContent = t('register');
    pwInput.setAttribute('autocomplete', 'new-password');
  }
  document.getElementById('auth-error').classList.remove('show');
}

async function handleAuth() {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const submitBtn = document.getElementById('auth-submit');

  if (!email || !password) {
    showAuthError(t('enter_email_password'));
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = authMode === 'login' ? t('logging_in') : t('registering');

  try {
    const endpoint = authMode === 'login' ? `${AUTH_API}/login` : `${AUTH_API}/register`;
    const resp = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });

    const data = await resp.json().catch(() => ({}));

    if (!resp.ok) {
      showAuthError(data.detail || t('something_wrong_generic'));
      return;
    }

    // Store token and proceed to survey
    setAuthToken(data.token);
    hideAuthOverlay();
    document.getElementById('auth-password').value = '';
    // Initialize the survey
    init();
  } catch (e) {
    showAuthError(t('conn_error_auth'));
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = authMode === 'login' ? t('log_in') : t('register');
  }
}

function logout() {
  clearAuthToken();
  showAuthOverlay();
  document.getElementById('auth-email').value = '';
  document.getElementById('auth-password').value = '';
}

// Enter key on password field submits
document.addEventListener('DOMContentLoaded', () => {
  const pwInput = document.getElementById('auth-password');
  if (pwInput) {
    pwInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleAuth();
    });
  }
  const emailInput = document.getElementById('auth-email');
  if (emailInput) {
    emailInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('auth-password').focus();
    });
  }

  // Apply translations to the auth screen immediately
  // (init() will also call this for authenticated users)
  loadTranslations(currentLang).then(() => applyTranslations());

  // Check if user is authenticated before loading survey
  checkAuthAndInit();
});

async function checkAuthAndInit() {
  const token = getAuthToken();
  if (!token) {
    showAuthOverlay();
    return;
  }

  // Verify token is still valid by calling /api/auth/me
  try {
    const resp = await fetch(`${AUTH_API}/me`, {
      headers: { 'Authorization': `Bearer ${token}` },
    });
    if (resp.ok) {
      hideAuthOverlay();
      init();
    } else {
      clearAuthToken();
      showAuthOverlay();
    }
  } catch (e) {
    // Network error — try to load the survey anyway; endpoints will 401 if needed
    hideAuthOverlay();
    init();
  }
}

// Business type choices for Q1 — used for new onboarding sessions
// Strings must match the backend exactly (no spaces around slashes)
const BUSINESS_TYPES = [
  'Restaurant/Cafe',
  'Salon/Spa/Barber',
  'Plumber/Electrician/HVAC',
  'Retail/Boutique',
  'Gym/Fitness Studio',
  'Landscaping/Lawn Care',
  'Auto Repair/Detailing',
  'Cleaning Service',
  'Photography/Video',
  'Real Estate',
  'Other (type your own)',
];

// Per-browser session ID — each browser gets its own conversation
let sessionId = localStorage.getItem('survey_session_id');
if (!sessionId) {
  sessionId = 's-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
  localStorage.setItem('survey_session_id', sessionId);
}

// Auto-scroll to bottom of chat
function autoScroll() {
  const chat = document.getElementById('chat-area');
  if (chat) chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
}

async function init() {
  try {
    // Load branding and translations before rendering anything
    await Promise.all([loadBranding(sessionId), loadTranslations(currentLang)]);
    applyTranslations();

    // Check if user has completed onboarding
    const status = await fetchWithTimeout(`${API}/checkin/status?session_id=${sessionId}`).then(r => r.json());

    if (status.mode === 'checkin') {
      // Returning user — check-in mode
      currentMode = 'checkin';
      updateModePill('checkin');
      const chat = document.getElementById('chat-area');
      const lastCheckin = status.latest_checkin;
      let greeting;
      if (branding && branding.custom_welcome) {
        greeting = branding.custom_welcome;
      } else if (lastCheckin) {
        greeting = `${t('checkin_greeting_return')} ${new Date(lastCheckin.created_at).toLocaleDateString()}. ${t('checkin_greeting_new').replace('Welcome back. ', '')}`;
      } else {
        greeting = t('checkin_greeting_new');
      }
      chat.innerHTML = '';
      chat.classList.add('mode-transition');
      setTimeout(() => chat.classList.remove('mode-transition'), 600);
      const wrapper = document.createElement('div');
      wrapper.className = 'msg-ai';
      const bubble = document.createElement('div');
      bubble.className = 'msg-ai-bubble';
      bubble.textContent = `${greeting} ${t('checkin_prompt')}`;
      wrapper.appendChild(bubble);
      chat.appendChild(wrapper);
      autoScroll();
      showInput();
      updateHeader();
      return;
    }

    // Onboarding mode
    currentMode = 'onboarding';
    updateModePill('onboarding');
    const state = await fetchWithTimeout(`${API}/state?session_id=${sessionId}`).then(r => r.json());
    qIndex = state.q_index || 0;
    totalQuestions = state.total_questions || 0;

    // Update the static HTML header and progress bar max from the API value
    document.getElementById('header-sub').textContent = t('question_of', { n: qIndex + 1, total: totalQuestions });
    document.getElementById('progress-bar').setAttribute('aria-valuemax', String(totalQuestions));

    if (state.conversation && state.conversation.length > 0) {
      // Returning user — restore the full conversation
      renderExistingConversation(state);
      autoScroll();
    } else {
      // New user — show the opening message (built with createElement for safety)
      const chat = document.getElementById('chat-area');
      chat.innerHTML = '';
      const wrapper = document.createElement('div');
      wrapper.className = 'msg-ai';
      const bubble = document.createElement('div');
      bubble.className = 'msg-ai-bubble';
      bubble.textContent = t('survey_greeting');
      const strong = document.createElement('strong');
      strong.textContent = t('survey_greeting_q');
      bubble.appendChild(strong);
      wrapper.appendChild(bubble);
      chat.appendChild(wrapper);
      autoScroll();
    }

    updateProgress();
    updateHeader();

    if (qIndex >= totalQuestions) {
      showComplete();
      return;
    }

    // For new onboarding users (qIndex === 0), show business type choices as Q1
    if (currentMode === 'onboarding' && qIndex === 0) {
      showInput(BUSINESS_TYPES);
    } else {
      showInput();
    }
  } catch (e) {
    console.error('Init error:', e);
    showInput();
  }
}

function renderExistingConversation(state) {
  const chat = document.getElementById('chat-area');
  chat.innerHTML = '';
  for (const msg of state.conversation) {
    if (msg.role === 'user') {
      const el = document.createElement('div');
      el.className = 'msg-user';
      el.textContent = msg.content;
      chat.appendChild(el);
    } else {
      const wrap = document.createElement('div');
      wrap.className = 'msg-ai';
      const bubble = document.createElement('div');
      bubble.className = 'msg-ai-bubble';
      bubble.textContent = msg.content;
      wrap.appendChild(bubble);
      chat.appendChild(wrap);
    }
  }
  chat.scrollTop = chat.scrollHeight;
  autoScroll();
}

function updateProgress() {
  const bar = document.getElementById('progress-bar');
  bar.innerHTML = '';
  bar.setAttribute('aria-valuenow', qIndex + 1);
  for (let i = 0; i < totalQuestions; i++) {
    const dot = document.createElement('div');
    dot.className = 'progress-dot';
    if (i < qIndex) dot.classList.add('done');
    else if (i === qIndex) dot.classList.add('current');
    bar.appendChild(dot);
  }
}

function updateHeader() {
  const sub = document.getElementById('header-sub');
  if (qIndex < totalQuestions) {
    sub.textContent = t('question_of', { n: qIndex + 1, total: totalQuestions });
  } else {
    sub.textContent = t('complete');
  }
}

function updateModePill(mode) {
  const pill = document.getElementById('mode-pill');
  if (!pill) return;
  pill.className = `mode-pill ${mode}`;
  pill.textContent = mode === 'checkin' ? t('daily_checkin') : t('onboarding');
}

function showInput(choices) {
  const area = document.getElementById('input-area');
  currentChoices = choices || null;

  if (choices && choices.length > 0) {
    // Use createElement instead of innerHTML to prevent XSS
    const container = document.createElement('div');
    container.className = 'choices';
    container.setAttribute('role', 'group');
    container.setAttribute('aria-label', 'Answer choices');

    choices.forEach((c, i) => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.style.animationDelay = `${i * 40}ms`;
      btn.setAttribute('aria-label', c);
      btn.onclick = () => submitAnswer(c);

      const dot = document.createElement('div');
      dot.className = 'dot';
      btn.appendChild(dot);

      const span = document.createElement('span');
      span.textContent = c;  // textContent is XSS-safe
      btn.appendChild(span);

      container.appendChild(btn);
    });

    // Add "type your own" option
    const ownBtn = document.createElement('button');
    ownBtn.className = 'choice-btn';
    ownBtn.style.animationDelay = `${choices.length * 40}ms`;
    ownBtn.style.color = 'var(--warm-muted)';
    ownBtn.style.fontStyle = 'italic';
    ownBtn.setAttribute('aria-label', 'Type your own answer');
    ownBtn.onclick = () => switchToTextInput();

    const ownDot = document.createElement('div');
    ownDot.className = 'dot';
    ownBtn.appendChild(ownDot);

    const ownSpan = document.createElement('span');
    ownSpan.textContent = t('type_own_answer');
    ownBtn.appendChild(ownSpan);

    container.appendChild(ownBtn);
    area.innerHTML = '';
    area.appendChild(container);
    autoScroll();
  } else {
    area.innerHTML = `
      <div class="recording-indicator" id="recording-indicator"><div class="recording-dot"></div><span>${t('listening')}</span></div>
      <div class="text-wrap">
        <textarea class="text-input" id="text-answer" placeholder="${t('type_answer')}" rows="1" onkeydown="handleKey(event)" oninput="autoGrow(this)" aria-label="${t('type_answer')}"></textarea>
        <button class="mic-btn" id="mic-btn" onclick="toggleVoiceInput()" aria-label="Voice input" style="display:none">🎤</button>
        <button class="send-btn" onclick="submitTextAnswer()" id="send-btn" aria-label="Send answer">→</button>
      </div>`;
    if (currentMode === 'checkin') showMicButton();
    setTimeout(() => document.getElementById('text-answer')?.focus(), 50);
    autoScroll();
  }
}

function switchToTextInput() {
  // Replace choices with a text input, keeping the same choices context
  const area = document.getElementById('input-area');
  area.innerHTML = `
    <div class="recording-indicator" id="recording-indicator"><div class="recording-dot"></div><span>${t('listening')}</span></div>
    <div class="text-wrap">
      <textarea class="text-input" id="text-answer" placeholder="${t('type_answer')}" rows="1" onkeydown="handleKey(event)" oninput="autoGrow(this)"></textarea>
      <button class="mic-btn" id="mic-btn" onclick="toggleVoiceInput()" aria-label="Voice input" style="display:none">🎤</button>
      <button class="send-btn" onclick="submitTextAnswer()" id="send-btn">→</button>
    </div>`;
  if (currentMode === 'checkin') showMicButton();
  setTimeout(() => document.getElementById('text-answer')?.focus(), 50);
  autoScroll();
}

function showThinking() {
  // Replace input area with a disabled-looking placeholder
  // so the chat bar is empty but visible while AI is thinking
  const area = document.getElementById('input-area');
  area.innerHTML = `<div class="text-wrap"><div class="text-input" style="opacity:0.4;cursor:default">${t('thinking')}</div><button class="send-btn" disabled>→</button></div>`;
}

async function submitAnswer(answer) {
  if (isStreaming) return;
  isStreaming = true;
  pendingChoices = null;

  const chat = document.getElementById('chat-area');
  const userMsg = document.createElement('div');
  userMsg.className = 'msg-user';
  userMsg.textContent = answer;
  chat.appendChild(userMsg);
  chat.scrollTop = chat.scrollHeight;
  autoScroll();

  // Route to the right endpoint based on mode
  const endpoint = currentMode === 'checkin' ? `${API}/checkin` : `${API}/chat`;

  showThinking();

  // AI bubble with loading dots — stays visible during the 1-2s wait
  const aiWrap = document.createElement('div');
  aiWrap.className = 'msg-ai';
  const aiBubble = document.createElement('div');
  aiBubble.className = 'msg-ai-bubble';
  aiBubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  aiWrap.appendChild(aiBubble);
  chat.appendChild(aiWrap);
  chat.scrollTop = chat.scrollHeight;
  autoScroll();

  try {
    const resp = await fetchWithTimeout(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ answer, session_id: sessionId }),
    });

    if (!resp.ok) {
      aiBubble.textContent = t('something_wrong');
      isStreaming = false;
      showInput(currentChoices);
      return;
    }

    // Read the full response from the stream
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const dataStr = line.slice(6).trim();
        if (dataStr === '[DONE]') continue;

        try {
          const data = JSON.parse(dataStr);
          if (data.content) {
            fullText += data.content;
          }
          if (data.state) {
            qIndex = data.state.q_index;
            updateProgress();
            updateHeader();
          }
          if (data.choices && data.choices.length > 0) {
            pendingChoices = data.choices;
          }
          if (data.done) {
            if (currentMode === 'checkin') {
              setTimeout(() => showCheckinComplete(), 1500);
            } else {
              setTimeout(() => showComplete(), 1500);
            }
          }
        } catch(e) { console.error('SSE parse error:', e, dataStr); }
      }
    }

    // Strip CHOICES marker from the text the typewriter will reveal
    const finalText = fullText
      .replace(/\n*CHOICES:\s*[^\n]+/gi, '')
      .replace(/\n{3,}/g, '\n\n')
      .trim();

    // Typewriter reveal: dots already showing, now type out the text
    aiBubble.innerHTML = '<span class="stream-cursor"></span>';
    await new Promise(resolve => {
      let i = 0;
      function tick() {
        if (i >= finalText.length) { resolve(); return; }
        i += 2; // 2 chars per tick
        aiBubble.innerHTML = escapeHtml(finalText.slice(0, i)) + '<span class="stream-cursor"></span>';
        autoScroll();
        const lastChar = finalText[i - 1] || '';
        let delay = 16;
        if ('.!?'.includes(lastChar)) delay = 120;
        else if (',;:'.includes(lastChar)) delay = 50;
        else if (lastChar === '\n') delay = 40;
        else if (lastChar === ' ') delay = 10;
        setTimeout(tick, delay);
      }
      tick();
    });

    // Done typing — remove cursor
    aiBubble.innerHTML = escapeHtml(finalText);
    chat.scrollTop = chat.scrollHeight;
    autoScroll();

    // Show next input
    if (qIndex < totalQuestions) {
      if (pendingChoices && pendingChoices.length > 0) {
        showInput(pendingChoices);
        pendingChoices = null;
      } else {
        showInput();
      }
      autoScroll();
    }

  } catch (e) {
    aiBubble.textContent = t('connection_error');
  }

  isStreaming = false;
}

function submitTextAnswer() {
  const ta = document.getElementById('text-answer');
  if (!ta) return;
  const answer = ta.value.trim();
  if (!answer) return;
  // Clear the input immediately so it doesn't linger
  ta.value = '';
  ta.style.height = 'auto';
  submitAnswer(answer);
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    submitTextAnswer();
  }
}

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

async function resetSurvey() {
  if (!confirm(t('start_over'))) return;
  const resp = await fetchWithTimeout(`${API}/reset?session_id=${sessionId}`, { method: 'POST' });
  if (!resp.ok) { alert(t('reset_failed')); return; }
  location.reload();
}

async function loadTranscript() {
  try {
    const data = await fetchWithTimeout(`${API}/transcript?session_id=${sessionId}`).then(r => r.json());
    const panel = document.getElementById('transcript-panel');
    if (!panel) return;

    const conv = data.conversation || [];
    let html = `<h4>${t('conversation')}</h4>`;
    for (let i = 0; i < conv.length; i++) {
      const msg = conv[i];
      if (msg.role === 'assistant') {
        html += `<div class="t-row"><div class="t-q">AI: ${escapeHtml(msg.content)}</div>`;
        if (i + 1 < conv.length && conv[i + 1].role === 'user') {
          html += `<div class="t-a">You: ${escapeHtml(conv[i + 1].content)}</div>`;
          i++;
        }
        html += '</div>';
      }
    }
    panel.innerHTML = html;
  } catch (e) {
    console.error('Transcript error:', e);
  }
}

function toggleTranscript() {
  const panel = document.getElementById('transcript-panel');
  if (panel) panel.classList.toggle('open');
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[ch]));
}

// ── Reminder settings management ───────────────────────────────
const REMINDER_API = '/api/reminder';

// Settings modal controls
function openSettingsModal() {
  document.getElementById('settings-modal').classList.add('show');
  loadReminderSettings('settings');
}

function closeSettingsModal() {
  document.getElementById('settings-modal').classList.remove('show');
}

// Close settings modal when clicking the backdrop
document.addEventListener('click', (e) => {
  const modal = document.getElementById('settings-modal');
  if (e.target === modal) closeSettingsModal();
});

// Toggle the reminder switch in the settings modal
function toggleReminderSwitch() {
  const sw = document.getElementById('settings-reminder-toggle');
  sw.classList.toggle('on');
  sw.setAttribute('aria-checked', sw.classList.contains('on') ? 'true' : 'false');
}

// Load existing reminder settings from the server
async function loadReminderSettings(prefix) {
  try {
    const resp = await fetchWithTimeout(`${REMINDER_API}/settings`);
    if (!resp.ok) return;
    const data = await resp.json();
    const emailEl = document.getElementById(`${prefix}-reminder-email`);
    const timeEl = document.getElementById(`${prefix}-reminder-time`);
    const toggleEl = document.getElementById(`${prefix}-reminder-toggle`);
    if (emailEl && data.email) emailEl.value = data.email;
    if (timeEl && data.reminder_time) timeEl.value = data.reminder_time;
    if (toggleEl) {
      if (data.enabled) {
        toggleEl.classList.add('on');
        toggleEl.setAttribute('aria-checked', 'true');
      } else {
        toggleEl.classList.remove('on');
        toggleEl.setAttribute('aria-checked', 'false');
      }
    }
  } catch (e) {
    console.error('Failed to load reminder settings:', e);
  }
}

// Save reminder settings — works for both the settings modal and the post-survey form
async function saveReminderSettings(prefix) {
  const emailEl = document.getElementById(`${prefix}-reminder-email`);
  const timeEl = document.getElementById(`${prefix}-reminder-time`);
  const toggleEl = document.getElementById(`${prefix}-reminder-toggle`);
  const statusEl = document.getElementById(`${prefix}-reminder-status`);
  const btnEl = prefix === 'settings' ? document.getElementById('settings-save-btn') : null;

  const email = emailEl ? emailEl.value.trim() : '';
  const reminder_time = timeEl ? timeEl.value : '08:00';
  const enabled = toggleEl ? toggleEl.classList.contains('on') : true;

  if (!email) {
    showReminderStatus(statusEl, 'Please enter an email address.', 'error');
    return;
  }

  if (btnEl) btnEl.disabled = true;

  try {
    const resp = await fetchWithTimeout(`${REMINDER_API}/settings`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, reminder_time, enabled }),
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      showReminderStatus(statusEl, err.detail || 'Failed to save settings.', 'error');
      return;
    }

    showReminderStatus(statusEl, 'Reminder settings saved! You\'ll get a daily email at ' + reminder_time + '.', 'success');
  } catch (e) {
    showReminderStatus(statusEl, 'Network error. Please try again.', 'error');
  } finally {
    if (btnEl) btnEl.disabled = false;
  }
}

function showReminderStatus(el, message, type) {
  if (!el) return;
  el.textContent = message;
  el.className = `reminder-status show ${type}`;
}
