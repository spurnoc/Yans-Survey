<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a1a">
<title>Yans Deli — Daily 15 Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --cream-bg:#efece8;
  --cream-surface:#e8e6e3;
  --cream-light:#f5f3f0;
  --warm-dark:#1a1a1a;
  --warm-muted:rgba(26,26,26,0.5);
  --warm-faint:rgba(26,26,26,0.06);
  --warm-border:rgba(26,26,26,0.07);
  --accent:#d6364e;
  --accent-soft:rgba(214,54,78,0.08);
  --accent-hover:#ff3344;
  --radius:14px;
  --radius-lg:20px;
  --radius-pill:9999px;
}

html,body{height:100%;overflow:hidden}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  color:var(--warm-dark);
  background:var(--cream-bg);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;outline:none}
textarea{resize:none}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.1);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,0.18)}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes pulse{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

#app{
  display:flex;flex-direction:column;height:100vh;
  max-width:600px;margin:0 auto;position:relative;
  background:var(--cream-bg);
}

/* ── Header ─────────────────────────────────────────── */
.header{
  padding:18px 24px 14px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;z-index:10;
}
.header-brand{display:flex;align-items:center;gap:10px}
.brand-mark{
  width:32px;height:32px;border-radius:8px;
  background:var(--warm-dark);color:var(--cream-bg);
  display:flex;align-items:center;justify-content:center;
  font-family:'Instrument Serif',serif;font-size:16px;font-style:italic;
}
.header-title{
  font-family:'Instrument Serif',serif;font-size:19px;
  letter-spacing:-0.3px;line-height:1.2;
}
.header-sub{
  font-size:11px;color:var(--warm-muted);
  margin-top:1px;letter-spacing:0.2px;
  font-variant-numeric:tabular-nums;
}
.reset-btn{
  font-size:12px;color:var(--warm-muted);
  padding:6px 14px;border-radius:var(--radius-pill);
  transition:all .2s;font-weight:500;
}
.reset-btn:hover{background:var(--warm-faint);color:var(--warm-dark)}

/* ── Progress ───────────────────────────────────────── */
.progress-bar{
  display:flex;gap:4px;padding:0 24px 14px;flex-shrink:0;
}
.progress-dot{
  flex:1;height:3px;border-radius:2px;
  background:var(--warm-faint);
  transition:background .4s,opacity .4s;
}
.progress-dot.done{background:var(--accent)}
.progress-dot.current{
  background:var(--accent);opacity:0.4;
  animation:blink 2s infinite;
}

/* ── Chat ───────────────────────────────────────────── */
.chat-area{
  flex:1;overflow-y:auto;
  padding:8px 24px 20px;
  display:flex;flex-direction:column;gap:18px;
  scroll-behavior:smooth;
}

/* AI message */
.msg-ai{
  align-self:flex-start;max-width:82%;
  animation:msgIn .35s cubic-bezier(0.22,1,0.36,1);
}
.msg-ai-bubble{
  padding:13px 18px;
  background:var(--cream-light);
  border:1px solid var(--warm-border);
  border-radius:var(--radius-lg) var(--radius-lg) var(--radius-lg) 4px;
  font-size:14.5px;line-height:1.6;
  word-wrap:break-word;
}
.msg-ai-bubble strong{font-weight:600;color:var(--warm-dark)}

/* User message */
.msg-user{
  align-self:flex-end;max-width:82%;
  padding:13px 18px;
  background:var(--warm-dark);color:var(--cream-bg);
  border-radius:var(--radius-lg) var(--radius-lg) 4px var(--radius-lg);
  font-size:14.5px;line-height:1.6;
  word-wrap:break-word;
  animation:msgIn .35s cubic-bezier(0.22,1,0.36,1);
}

/* Typing indicator */
.typing-wrap{align-self:flex-start;animation:fadeIn .2s}
.typing{
  display:flex;align-items:center;gap:5px;
  padding:2px 0;
}
.typing span{
  width:7px;height:7px;border-radius:50%;
  background:var(--warm-muted);
  animation:pulse 1.4s infinite;
}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}

/* Streaming cursor */
.stream-cursor{
  display:inline-block;width:2px;height:1.1em;
  background:var(--accent);margin-left:2px;
  animation:blink .9s infinite;vertical-align:text-bottom;
  border-radius:1px;
}

/* ── Input area ────────────────────────────────────── */
.input-area{
  padding:12px 24px 20px;
  flex-shrink:0;
  border-top:1px solid var(--warm-border);
}

/* Choice buttons */
.choices{display:flex;flex-direction:column;gap:7px}
.choice-btn{
  padding:13px 16px;
  background:var(--cream-light);
  border:1px solid var(--warm-border);
  border-radius:var(--radius);
  font-size:14px;color:var(--warm-dark);
  text-align:left;
  display:flex;align-items:center;gap:12px;
  transition:all .18s cubic-bezier(0.22,1,0.36,1);
  animation:msgIn .3s;
}
.choice-btn:hover{
  border-color:var(--accent);
  background:var(--accent-soft);
  transform:translateX(2px);
}
.choice-btn:active{transform:scale(0.985)}
.choice-btn .dot{
  width:14px;height:14px;border-radius:50%;
  border:2px solid var(--warm-border);
  flex-shrink:0;transition:all .18s;
}
.choice-btn:hover .dot{border-color:var(--accent)}

/* Text input */
.text-wrap{display:flex;gap:8px;align-items:flex-end}
.text-input{
  flex:1;padding:13px 16px;
  background:var(--cream-light);
  border:1px solid var(--warm-border);
  border-radius:var(--radius);
  font-size:14.5px;line-height:1.5;
  color:var(--warm-dark);
  min-height:46px;max-height:120px;
  transition:border-color .2s;
}
.text-input:focus{border-color:var(--accent)}
.text-input::placeholder{color:rgba(26,26,26,0.35)}
.send-btn{
  width:46px;height:46px;
  border-radius:var(--radius);
  background:var(--warm-dark);color:var(--cream-bg);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:18px;
  transition:all .2s;
}
.send-btn:hover{background:var(--accent)}
.send-btn:disabled{opacity:0.35;cursor:not-allowed}

/* ── Complete screen ────────────────────────────────── */
.complete-screen{
  text-align:center;padding:32px 20px;
  animation:msgIn .5s cubic-bezier(0.22,1,0.36,1);
}
.complete-icon{
  width:56px;height:56px;margin:0 auto 16px;
  border-radius:50%;
  background:var(--accent-soft);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;
}
.complete-screen h2{
  font-family:'Instrument Serif',serif;font-size:26px;
  margin-bottom:8px;letter-spacing:-0.3px;
}
.complete-screen p{
  font-size:14px;color:var(--warm-muted);
  max-width:360px;margin:0 auto 24px;line-height:1.6;
}
.transcript-toggle{
  font-size:13px;color:var(--accent);cursor:pointer;
  text-align:center;padding:8px;font-weight:500;
  transition:opacity .15s;
}
.transcript-toggle:hover{opacity:0.7}
.transcript-panel{
  max-width:90%;align-self:center;
  background:var(--cream-light);
  border:1px solid var(--warm-border);
  border-radius:var(--radius);padding:16px 20px;
  margin:8px 0;font-size:13px;line-height:1.6;
  display:none;
}
.transcript-panel.open{display:block;animation:fadeIn .3s}
.transcript-panel h4{
  font-family:'Instrument Serif',serif;font-size:15px;margin-bottom:10px;
}
.t-row{padding:8px 0;border-bottom:1px solid var(--warm-border)}
.t-row:last-child{border-bottom:none}
.t-q{font-weight:500;color:var(--warm-dark);font-size:13px}
.t-a{color:var(--warm-muted);margin-top:3px}

@media(max-width:480px){
  #app{max-width:100%}
  .msg-ai,.msg-user{max-width:90%}
  .header{padding:14px 16px 12px}
  .progress-bar{padding:0 16px 12px}
  .chat-area{padding:8px 16px 16px}
  .input-area{padding:10px 16px 16px}
  .header-title{font-size:17px}
}
</style>
</head>
<body>

<div id="app">
  <div class="header">
    <div class="header-brand">
      <div class="brand-mark">Y</div>
      <div>
        <div class="header-title">Yans Deli</div>
        <div class="header-sub" id="header-sub">Question 1 of 13</div>
      </div>
    </div>
    <div class="reset-btn" onclick="resetSurvey()">Reset</div>
  </div>

  <div class="progress-bar" id="progress-bar"></div>

  <div class="chat-area" id="chat-area">
    <!-- Populated by init() — either opening message for new sessions or full conversation for returning ones -->
  </div>

  <div class="input-area" id="input-area"></div>
</div>

<script>
const API = '/api/survey';
let qIndex = 0;
let totalQuestions = 13;
let isStreaming = false;
let currentChoices = null;
let pendingChoices = null;

// Per-browser session ID — each browser gets its own conversation
let sessionId = localStorage.getItem('survey_session_id');
if (!sessionId) {
  sessionId = 's-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
  localStorage.setItem('survey_session_id', sessionId);
}

async function init() {
  try {
    const state = await fetch(`${API}/state?session_id=${sessionId}`).then(r => r.json());
    qIndex = state.q_index || 0;
    totalQuestions = state.total_questions || 13;

    if (state.conversation && state.conversation.length > 0) {
      // Returning user — restore the full conversation
      renderExistingConversation(state);
    } else {
      // New user — show the opening message
      const chat = document.getElementById('chat-area');
      chat.innerHTML = `
        <div class="msg-ai">
          <div class="msg-ai-bubble">Hey Benji — quick survey about how you run things day to day. No wrong answers, just want to understand your world. First one: <strong>Right now, how do you keep track of all this? Reviews, money, marketing.</strong></div>
        </div>`;
    }

    updateProgress();
    updateHeader();

    if (qIndex >= totalQuestions) {
      showComplete();
      return;
    }

    showInput();
  } catch (e) {
    console.error('Init error:', e);
    showInput();
  }
}

function renderExistingConversation(state) {
  const chat = document.getElementById('chat-area');
  chat.innerHTML = '';
  for (const msg of state.conversation) {
    if (msg.role === 'user') {
      const el = document.createElement('div');
      el.className = 'msg-user';
      el.textContent = msg.content;
      chat.appendChild(el);
    } else {
      const wrap = document.createElement('div');
      wrap.className = 'msg-ai';
      const bubble = document.createElement('div');
      bubble.className = 'msg-ai-bubble';
      bubble.textContent = msg.content;
      wrap.appendChild(bubble);
      chat.appendChild(wrap);
    }
  }
  chat.scrollTop = chat.scrollHeight;
}

function updateProgress() {
  const bar = document.getElementById('progress-bar');
  bar.innerHTML = '';
  for (let i = 0; i < totalQuestions; i++) {
    const dot = document.createElement('div');
    dot.className = 'progress-dot';
    if (i < qIndex) dot.classList.add('done');
    else if (i === qIndex) dot.classList.add('current');
    bar.appendChild(dot);
  }
}

function updateHeader() {
  const sub = document.getElementById('header-sub');
  if (qIndex < totalQuestions) {
    sub.textContent = `Question ${qIndex + 1} of ${totalQuestions}`;
  } else {
    sub.textContent = 'Complete';
  }
}

function showInput(choices) {
  const area = document.getElementById('input-area');
  currentChoices = choices || null;

  if (choices && choices.length > 0) {
    let html = '<div class="choices">';
    choices.forEach((c, i) => {
      html += `<button class="choice-btn" style="animation-delay:${i * 40}ms" onclick="submitAnswer('${c.replace(/'/g, "\\'")}')"><div class="dot"></div><span>${escapeHtml(c)}</span></button>`;
    });
    html += '</div>';
    area.innerHTML = html;
  } else {
    area.innerHTML = `
      <div class="text-wrap">
        <textarea class="text-input" id="text-answer" placeholder="Type your answer..." rows="1" onkeydown="handleKey(event)" oninput="autoGrow(this)"></textarea>
        <button class="send-btn" onclick="submitTextAnswer()" id="send-btn">→</button>
      </div>`;
    setTimeout(() => document.getElementById('text-answer')?.focus(), 50);
  }
}

function showThinking() {
  // Replace input area with a disabled-looking placeholder
  // so the chat bar is empty but visible while AI is thinking
  const area = document.getElementById('input-area');
  area.innerHTML = '<div class="text-wrap"><div class="text-input" style="opacity:0.4;cursor:default">Thinking...</div><button class="send-btn" disabled>→</button></div>';
}

function showComplete() {
  const chat = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'complete-screen';
  div.innerHTML = `
    <div class="complete-icon">🍁</div>
    <h2>That's everything</h2>
    <p>Thanks Benji — this gives us a real picture of where you're at. We'll take this and make sure Daily 15 actually fits how you work.</p>
    <div class="transcript-toggle" onclick="toggleTranscript()">View full transcript</div>
    <div class="transcript-panel" id="transcript-panel"></div>
  `;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  document.getElementById('input-area').innerHTML = '';
  document.getElementById('header-sub').textContent = 'Complete';
  loadTranscript();
}

async function submitAnswer(answer) {
  if (isStreaming) return;
  isStreaming = true;
  pendingChoices = null;

  const chat = document.getElementById('chat-area');
  const userMsg = document.createElement('div');
  userMsg.className = 'msg-user';
  userMsg.textContent = answer;
  chat.appendChild(userMsg);
  chat.scrollTop = chat.scrollHeight;

  showThinking();

  // AI bubble with loading dots — stays visible during the 1-2s wait
  const aiWrap = document.createElement('div');
  aiWrap.className = 'msg-ai';
  const aiBubble = document.createElement('div');
  aiBubble.className = 'msg-ai-bubble';
  aiBubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  aiWrap.appendChild(aiBubble);
  chat.appendChild(aiWrap);
  chat.scrollTop = chat.scrollHeight;

  try {
    const resp = await fetch(API + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ answer, session_id: sessionId }),
    });

    if (!resp.ok) {
      aiBubble.textContent = 'Something went wrong. Try again.';
      isStreaming = false;
      showInput(currentChoices);
      return;
    }

    // Read the full response from the stream
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const dataStr = line.slice(6).trim();
        if (dataStr === '[DONE]') continue;

        try {
          const data = JSON.parse(dataStr);
          if (data.content) {
            fullText += data.content;
          }
          if (data.state) {
            qIndex = data.state.q_index;
            updateProgress();
            updateHeader();
          }
          if (data.choices && data.choices.length > 0) {
            pendingChoices = data.choices;
          }
          if (data.done) {
            setTimeout(() => showComplete(), 1500);
          }
        } catch {}
      }
    }

    // Strip CHOICES and ACTION markers from the text the typewriter will reveal
    const finalText = fullText
      .replace(/\n*ACTION:\s*\w+/gi, '')
      .replace(/\n*CHOICES:\s*[^\n]+/gi, '')
      .replace(/\n{3,}/g, '\n\n')
      .trim();

    // Typewriter reveal: dots already showing, now type out the text
    aiBubble.innerHTML = '<span class="stream-cursor"></span>';
    await new Promise(resolve => {
      let i = 0;
      function tick() {
        if (i >= finalText.length) { resolve(); return; }
        i += 2; // 2 chars per tick
        aiBubble.innerHTML = escapeHtml(finalText.slice(0, i)) + '<span class="stream-cursor"></span>';
        chat.scrollTop = chat.scrollHeight;
        const lastChar = finalText[i - 1] || '';
        let delay = 16;
        if ('.!?'.includes(lastChar)) delay = 120;
        else if (',;:'.includes(lastChar)) delay = 50;
        else if (lastChar === '\n') delay = 40;
        else if (lastChar === ' ') delay = 10;
        setTimeout(tick, delay);
      }
      tick();
    });

    // Done typing — remove cursor
    aiBubble.innerHTML = escapeHtml(finalText);
    chat.scrollTop = chat.scrollHeight;

    // Show next input
    if (qIndex < totalQuestions) {
      if (pendingChoices && pendingChoices.length > 0) {
        showInput(pendingChoices);
        pendingChoices = null;
      } else {
        showInput();
      }
    }

  } catch (e) {
    aiBubble.textContent = 'Connection error. Try again.';
  }

  isStreaming = false;
}

function submitTextAnswer() {
  const ta = document.getElementById('text-answer');
  if (!ta) return;
  const answer = ta.value.trim();
  if (!answer) return;
  // Clear the input immediately so it doesn't linger
  ta.value = '';
  ta.style.height = 'auto';
  submitAnswer(answer);
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    submitTextAnswer();
  }
}

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

async function resetSurvey() {
  if (!confirm('Start over? This clears the conversation.')) return;
  await fetch(`${API}/reset?session_id=${sessionId}`, { method: 'POST' });
  location.reload();
}

async function loadTranscript() {
  try {
    const data = await fetch(`${API}/transcript?session_id=${sessionId}`).then(r => r.json());
    const panel = document.getElementById('transcript-panel');
    if (!panel) return;

    const conv = data.conversation || [];
    let html = '<h4>Conversation</h4>';
    for (let i = 0; i < conv.length; i++) {
      const msg = conv[i];
      if (msg.role === 'assistant') {
        html += `<div class="t-row"><div class="t-q">AI: ${escapeHtml(msg.content)}</div>`;
        if (i + 1 < conv.length && conv[i + 1].role === 'user') {
          html += `<div class="t-a">Benji: ${escapeHtml(conv[i + 1].content)}</div>`;
          i++;
        }
        html += '</div>';
      }
    }
    panel.innerHTML = html;
  } catch (e) {
    console.error('Transcript error:', e);
  }
}

function toggleTranscript() {
  const panel = document.getElementById('transcript-panel');
  if (panel) panel.classList.toggle('open');
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[ch]));
}

init();
</script>
</body>
</html>
